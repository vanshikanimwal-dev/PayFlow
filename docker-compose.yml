name: payflow

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5432:5432"
    volumes:
      - payflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build: ./gateway
    ports:
      - "8081:8081"
    environment:
      PAYFLOW_GATEWAY_HMAC_SECRET: ${PAYFLOW_GATEWAY_HMAC_SECRET:-dev-gateway-hmac-secret}
      PAYFLOW_CALLBACK_URL: http://backend:8080/api/v1/webhooks/gateway
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/payflow
      DATABASE_USERNAME: payflow
      DATABASE_PASSWORD: payflow
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      PAYFLOW_JWT_SECRET: ${PAYFLOW_JWT_SECRET:-dev-only-secret-change-me-please-32b}
      PAYFLOW_GATEWAY_URL: http://gateway:8081
      PAYFLOW_CALLBACK_URL: http://backend:8080/api/v1/webhooks/gateway
      PAYFLOW_GATEWAY_HMAC_SECRET: ${PAYFLOW_GATEWAY_HMAC_SECRET:-dev-gateway-hmac-secret}
      PAYFLOW_OUTBOX_BROKER: rabbit
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  payflow-postgres:
